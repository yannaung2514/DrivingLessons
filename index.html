<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚦日本の交通ルールを学ぼう - Learn Japan Traffic Rules</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🚗 日本の交通ルール</h1>
        <p>運転免許の学科試験に向けて、交通ルールを絵で学ぼう！<br>
           Learn Japanese traffic rules with pictures for your driving test (in Japanese).</p>
    </header>

    <!-- Progress bar -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Mode tabs -->
    <div class="mode-tabs">
        <button class="mode-tab active" id="studyTab" onclick="showMode('study')">📖 ルール Rules</button>
        <button class="mode-tab" id="wordTab" onclick="showMode('words')">🔤 言葉 Words</button>
        <button class="mode-tab" id="cardTab" onclick="showMode('cards')">🃏 カード Cards</button>
        <button class="mode-tab" id="quizTab" onclick="showMode('quiz')">📝 テスト Test</button>
    </div>

    <!-- Flashcard (Study mode) -->
    <section id="studySection">
        <div class="flashcard" id="flashcard">
            <div class="card-counter" id="cardCounter">1 / 26</div>
            <div class="card-image" id="cardImage">
                <img id="rulePhotoImage" alt="rule photo" style="display:none;">
                <div id="ruleSvgWrap"></div>
            </div>
            
            <input type="file" id="rulePhotoInput" accept="image/*" style="display:none;">
            <div class="card-category" id="cardCategory">カテゴリー</div>
            <div class="card-title-row">
                <div class="card-title" id="cardTitle">ルール名</div>
                <button class="fav-btn" id="favBtn" onclick="toggleFavorite()" title="お気に入り">☆</button>
            </div>
            <div class="card-reading" id="cardReading">読み方</div>
            <div class="card-jp" id="cardJp">日本語の説明</div>
            <div class="card-myanmar" id="cardMyanmar">မြန်မာဘာသာ ရှင်းလင်းချက်</div>
        </div>

        <div class="rule-nav-edge rule-nav-prev" title="← 前へ"></div>
        <div class="rule-nav-edge rule-nav-next" title="次へ →"><span>›</span></div>
    </section>
